  <style>
    * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { -webkit-font-smoothing: antialiased; }
    @keyframes fade-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade-in{animation:fade-in .4s ease forwards}
    @keyframes slide-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .slide-up{animation:slide-up .5s cubic-bezier(.16,1,.3,1) forwards}
    .glass{background:rgba(255,255,255,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
    .glass-soft{background:rgba(255,255,255,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .btn-press{transition:transform .15s cubic-bezier(.4,0,.2,1)}
    .btn-press:active{transform:scale(.97)}
    .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:ripple-anim .6s ease-out;pointer-events:none}
    @keyframes ripple-anim{to{transform:scale(4);opacity:0}}
    @keyframes float-up{0%{transform:translateY(0);opacity:0}10%{opacity:.5}90%{opacity:.3}100%{transform:translateY(-100vh);opacity:0}}
    .particle{position:absolute;border-radius:50%;pointer-events:none;animation:float-up linear infinite}
    .skeleton{background:linear-gradient(90deg,rgba(226,232,240,.5) 25%,rgba(203,213,225,.8) 50%,rgba(226,232,240,.5) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    @keyframes pulse-glow{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.3)}50%{box-shadow:0 0 0 8px rgba(59,130,246,0)}}
    .pulse-glow{animation:pulse-glow 2s ease-in-out infinite}
    @keyframes check-pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
    .check-pop{animation:check-pop .5s cubic-bezier(.16,1,.3,1) forwards}
    .scrollbar-none::-webkit-scrollbar{display:none}
    .scrollbar-none{-ms-overflow-style:none;scrollbar-width:none}
    .step-bar{transition:all .3s cubic-bezier(.4,0,.2,1)}
    .input-field{transition:border-color .2s,box-shadow .2s}
    .input-field:focus{box-shadow:0 0 0 3px rgba(59,130,246,.1)}
    .pay-method{transition:all .2s cubic-bezier(.4,0,.2,1)}
    .pay-method.selected{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.5)}
    .toggle-bg{transition:background-color .2s}
    .toggle-dot{transition:transform .2s cubic-bezier(.4,0,.2,1)}
    input[type="checkbox"].toggle:checked + .toggle-bg{background:#2563eb}
    input[type="checkbox"].toggle:checked + .toggle-bg .toggle-dot{transform:translateX(20px)}
