<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Domain Management | Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.460.0" defer></script>
  <style>
    * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { -webkit-font-smoothing: antialiased; background: #070b16; }
    .glass { background: rgba(15,23,42,.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .glass-soft { background: rgba(30,41,59,.4); backdrop-filter: blur(8px); }
    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fade-in .4s ease forwards; }
    @keyframes slide-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .slide-up { animation: slide-up .5s cubic-bezier(.16,1,.3,1) forwards; }
    .btn-press { transition: transform .15s cubic-bezier(.4,0,.2,1); }
    .btn-press:active { transform: scale(.97); }
    .input-field { transition: border-color .2s, box-shadow .2s; }
    .input-field:focus { box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
    .modal-overlay { animation: fade-in .2s ease forwards; }
    .modal-content { animation: slide-up .3s cubic-bezier(.16,1,.3,1) forwards; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(59,130,246,.2); border-radius: 3px; }
    .progress-step { transition: all .3s ease; }
    .progress-step.active { background: rgba(59,130,246,.2); border-color: rgba(59,130,246,.5); }
    .progress-step.completed { background: rgba(16,185,129,.15); border-color: rgba(16,185,129,.4); }
    .progress-line { transition: background .3s ease; }
    .progress-line.completed { background: rgba(16,185,129,.4); }
  </style>
  <script type="module" crossorigin src="/assets/adminDomains-Cpz-zy3Y.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/scroll-progress-C-Ryfqim.js">
  <link rel="modulepreload" crossorigin href="/assets/supabase-client-nvpjTmO6.js">
  <link rel="modulepreload" crossorigin href="/assets/auth-C8sthrmE.js">
</head>
<body class="bg-[#070b16] text-gray-100 min-h-screen p-4 sm:p-6">
  <div id="domain-app" class="max-w-6xl mx-auto">
    <!-- Loading state -->
    <div id="loading" class="flex items-center justify-center py-20">
      <div class="flex items-center gap-3 text-gray-500 text-sm">
        <i data-lucide="loader-2" class="w-5 h-5 animate-spin text-blue-400"></i> Loading domain management...
      </div>
    </div>

    <!-- Main content -->
    <div id="main-content" class="hidden fade-in space-y-5">
      <!-- Header -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div>
          <h2 class="text-xl font-bold text-white flex items-center gap-2">
            <i data-lucide="globe" class="w-5 h-5 text-blue-400"></i> Custom Domain Management
          </h2>
          <p class="text-sm text-gray-400 mt-1">Add, verify, and manage custom domains for your marketplace.</p>
        </div>
        <button onclick="showAddDomainModal()" class="btn-press flex items-center gap-2 px-5 py-3 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-bold rounded-xl text-sm transition shadow-lg shadow-blue-600/30">
          <i data-lucide="plus" class="w-4 h-4"></i> Add Domain
        </button>
      </div>

      <!-- Primary domain banner -->
      <div id="primary-banner" class="hidden glass border border-emerald-500/20 rounded-2xl p-4 flex items-center gap-3">
        <div class="w-10 h-10 bg-emerald-500/10 rounded-xl flex items-center justify-center shrink-0">
          <i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-bold text-white">Primary Domain: <span id="primary-domain-name" class="text-emerald-400"></span></p>
          <p class="text-xs text-gray-500">All traffic is served from this domain.</p>
        </div>
      </div>

      <!-- Domains list -->
      <div id="domains-list" class="space-y-3"></div>

      <!-- DNS Instructions section -->
      <div class="glass border border-blue-500/20 rounded-2xl p-5">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm font-bold text-white uppercase tracking-wide flex items-center gap-2">
            <i data-lucide="book-open" class="w-4 h-4 text-blue-400"></i> DNS Instructions by Registrar
          </h3>
          <button onclick="toggleDnsInstructions()" class="btn-press text-xs font-bold text-blue-400 hover:text-blue-300 transition">
            <span id="dns-toggle-text">Show Instructions</span>
          </button>
        </div>
        <div id="dns-instructions" class="hidden space-y-3"></div>
      </div>
    </div>
  </div>

  <!-- Modal container -->
  <div id="modal-container"></div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-[200] transform translate-y-20 opacity-0 bg-gray-900 border border-blue-500/30 text-white px-5 py-3 rounded-xl shadow-xl text-xs flex items-center gap-2 font-medium transition-all duration-300 pointer-events-none">
    <i data-lucide="info" class="w-4 h-4 text-blue-400"></i><span id="toast-msg">Action</span>
  </div>

  <!-- APP PROMOTION BANNER + LIVE PRODUCT PROMOTIONS -->
  <div id="trust-info-area"></div>
  <div id="app-promo-banner"></div>
  <div id="live-promo-alerts" class="fixed bottom-4 right-4 z-50 w-[340px] max-w-[90vw] space-y-3 pointer-events-none" aria-live="polite"></div>
</body>
</html>
