<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Domain Management | Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.460.0" defer></script>
  <style>
    * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { -webkit-font-smoothing: antialiased; background: #070b16; }
    .glass { background: rgba(15,23,42,.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .glass-soft { background: rgba(30,41,59,.4); backdrop-filter: blur(8px); }
    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fade-in .4s ease forwards; }
    @keyframes slide-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .slide-up { animation: slide-up .5s cubic-bezier(.16,1,.3,1) forwards; }
    .btn-press { transition: transform .15s cubic-bezier(.4,0,.2,1); }
    .btn-press:active { transform: scale(.97); }
    .input-field { transition: border-color .2s, box-shadow .2s; }
    .input-field:focus { box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
    .modal-overlay { animation: fade-in .2s ease forwards; }
    .modal-content { animation: slide-up .3s cubic-bezier(.16,1,.3,1) forwards; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(59,130,246,.2); border-radius: 3px; }
    .progress-step { transition: all .3s ease; }
    .progress-step.active { background: rgba(59,130,246,.2); border-color: rgba(59,130,246,.5); }
    .progress-step.completed { background: rgba(16,185,129,.15); border-color: rgba(16,185,129,.4); }
    .progress-line { transition: background .3s ease; }
    .progress-line.completed { background: rgba(16,185,129,.4); }
  </style>
</head>
<body class="bg-[#070b16] text-gray-100 min-h-screen p-4 sm:p-6">
  <div id="domain-app" class="max-w-6xl mx-auto">
    <!-- Loading state -->
    <div id="loading" class="flex items-center justify-center py-20">
      <div class="flex items-center gap-3 text-gray-500 text-sm">
        <i data-lucide="loader-2" class="w-5 h-5 animate-spin text-blue-400"></i> Loading domain management...
      </div>
    </div>

    <!-- Main content -->
    <div id="main-content" class="hidden fade-in space-y-5">
      <!-- Header -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div>
          <h2 class="text-xl font-bold text-white flex items-center gap-2">
            <i data-lucide="globe" class="w-5 h-5 text-blue-400"></i> Custom Domain Management
          </h2>
          <p class="text-sm text-gray-400 mt-1">Add, verify, and manage custom domains for your marketplace.</p>
        </div>
        <button onclick="showAddDomainModal()" class="btn-press flex items-center gap-2 px-5 py-3 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-bold rounded-xl text-sm transition shadow-lg shadow-blue-600/30">
          <i data-lucide="plus" class="w-4 h-4"></i> Add Domain
        </button>
      </div>

      <!-- Primary domain banner -->
      <div id="primary-banner" class="hidden glass border border-emerald-500/20 rounded-2xl p-4 flex items-center gap-3">
        <div class="w-10 h-10 bg-emerald-500/10 rounded-xl flex items-center justify-center shrink-0">
          <i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-bold text-white">Primary Domain: <span id="primary-domain-name" class="text-emerald-400"></span></p>
          <p class="text-xs text-gray-500">All traffic is served from this domain.</p>
        </div>
      </div>

      <!-- Domains list -->
      <div id="domains-list" class="space-y-3"></div>

      <!-- DNS Instructions section -->
      <div class="glass border border-blue-500/20 rounded-2xl p-5">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm font-bold text-white uppercase tracking-wide flex items-center gap-2">
            <i data-lucide="book-open" class="w-4 h-4 text-blue-400"></i> DNS Instructions by Registrar
          </h3>
          <button onclick="toggleDnsInstructions()" class="btn-press text-xs font-bold text-blue-400 hover:text-blue-300 transition">
            <span id="dns-toggle-text">Show Instructions</span>
          </button>
        </div>
        <div id="dns-instructions" class="hidden space-y-3"></div>
      </div>
    </div>
  </div>

  <!-- Modal container -->
  <div id="modal-container"></div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-[200] transform translate-y-20 opacity-0 bg-gray-900 border border-blue-500/30 text-white px-5 py-3 rounded-xl shadow-xl text-xs flex items-center gap-2 font-medium transition-all duration-300 pointer-events-none">
    <i data-lucide="info" class="w-4 h-4 text-blue-400"></i><span id="toast-msg">Action</span>
  </div>

  <script type="module">
    import { supabase } from '/src/supabase-client.js';
    import { getCurrentUser } from '/src/auth.js';

    const EDGE_URL = `${import.meta.env.VITE_SUPABASE_URL}/functions/v1/custom-domains`;
    let accessToken = null;
    let domains = [];

    // ── Helpers ──────────────────────────────────────────────
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3500);
      if (window.lucide) lucide.createIcons();
    }

    function escapeHtml(text) {
      if (text == null) return '';
      const div = document.createElement('div');
      div.textContent = String(text);
      return div.innerHTML;
    }

    function fmtDate(d) {
      if (!d) return '—';
      return new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function closeModal(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('modal-container').innerHTML = '';
    }
    window.closeModal = closeModal;

    function ripple(btn) {
      btn.addEventListener('click', function (e) {
        const r = this.getBoundingClientRect();
        const rip = document.createElement('span');
        rip.className = 'ripple';
        const s = Math.max(r.width, r.height);
        rip.style.width = rip.style.height = s + 'px';
        rip.style.left = (e.clientX - r.left - s / 2) + 'px';
        rip.style.top = (e.clientY - r.top - s / 2) + 'px';
        this.appendChild(rip);
        setTimeout(() => rip.remove(), 600);
      });
    }

    async function callEdge(action, body = {}) {
      const res = await fetch(EDGE_URL, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, ...body }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    // ── Status badge ─────────────────────────────────────────
    function statusBadge(status) {
      const map = {
        pending: { cls: 'bg-amber-500/10 text-amber-400 border-amber-500/20', icon: 'clock', label: 'DNS Pending' },
        dns_found: { cls: 'bg-blue-500/10 text-blue-400 border-blue-500/20', icon: 'search', label: 'DNS Found' },
        ssl_installing: { cls: 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20', icon: 'loader', label: 'SSL Installing' },
        connected: { cls: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20', icon: 'check-circle', label: 'Connected' },
        live: { cls: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20', icon: 'globe', label: 'Live' },
        failed: { cls: 'bg-red-500/10 text-red-400 border-red-500/20', icon: 'x-circle', label: 'Failed' },
      };
      const s = map[status] || map.pending;
      return `<span class="inline-flex items-center gap-1 ${s.cls} border text-[11px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wide"><i data-lucide="${s.icon}" class="w-3 h-3 ${status === 'ssl_installing' ? 'animate-spin' : ''}"></i>${s.label}</span>`;
    }

    function sslBadge(status) {
      const map = {
        none: { cls: 'bg-gray-500/10 text-gray-400 border-gray-500/20', label: 'No SSL' },
        pending: { cls: 'bg-amber-500/10 text-amber-400 border-amber-500/20', label: 'Pending' },
        active: { cls: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20', label: 'SSL Active' },
        failed: { cls: 'bg-red-500/10 text-red-400 border-red-500/20', label: 'SSL Failed' },
      };
      const s = map[status] || map.none;
      return `<span class="inline-flex items-center gap-1 ${s.cls} border text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wide">${s.label}</span>`;
    }

    // ── Progress indicator ───────────────────────────────────
    function progressIndicator(status) {
      const steps = [
        { id: 'pending', label: 'DNS Pending', icon: 'clock' },
        { id: 'dns_found', label: 'DNS Found', icon: 'search' },
        { id: 'ssl_installing', label: 'SSL Installing', icon: 'loader' },
        { id: 'connected', label: 'Connected', icon: 'check-circle' },
        { id: 'live', label: 'Live', icon: 'globe' },
      ];
      const currentIdx = steps.findIndex(s => s.id === status);

      return `
        <div class="flex items-center gap-1 sm:gap-2 mt-4">
          ${steps.map((step, i) => {
            const isCompleted = currentIdx > i;
            const isActive = currentIdx === i;
            const isLast = i === steps.length - 1;
            return `
              <div class="flex items-center ${isLast ? '' : 'flex-1'}">
                <div class="flex flex-col items-center gap-1 shrink-0">
                  <div class="progress-step w-8 h-8 rounded-full flex items-center justify-center border-2 ${isCompleted ? 'completed' : isActive ? 'active' : 'border-gray-700 bg-gray-800/50 text-gray-600'}">
                    ${isCompleted ? '<i data-lucide="check" class="w-4 h-4 text-emerald-400"></i>' : `<i data-lucide="${step.icon}" class="w-3.5 h-3.5 ${isActive ? 'text-blue-400' : 'text-gray-600'} ${isActive && step.icon === 'loader' ? 'animate-spin' : ''}"></i>`}
                  </div>
                  <span class="text-[9px] font-bold ${isActive ? 'text-blue-300' : isCompleted ? 'text-emerald-400' : 'text-gray-600'} text-center leading-tight hidden sm:block">${step.label}</span>
                </div>
                ${!isLast ? `<div class="progress-line h-0.5 flex-1 mx-1 rounded ${isCompleted ? 'completed' : 'bg-gray-700/50'}"></div>` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // ── Render domains list ──────────────────────────────────
    function renderDomains() {
      const container = document.getElementById('domains-list');
      const banner = document.getElementById('primary-banner');

      if (domains.length === 0) {
        container.innerHTML = `
          <div class="glass border border-blue-500/20 rounded-2xl p-8 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-500/10 rounded-2xl mb-4">
              <i data-lucide="globe" class="w-8 h-8 text-blue-400"></i>
            </div>
            <h3 class="text-lg font-bold text-white mb-2">No Custom Domains Yet</h3>
            <p class="text-sm text-gray-400 mb-4">Add your first custom domain to get started. We'll automatically generate the DNS records you need.</p>
            <button onclick="showAddDomainModal()" class="btn-press inline-flex items-center gap-2 px-5 py-3 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold rounded-xl text-sm transition shadow-lg shadow-blue-600/30">
              <i data-lucide="plus" class="w-4 h-4"></i> Add Your First Domain
            </button>
          </div>
        `;
        banner.classList.add('hidden');
        if (window.lucide) lucide.createIcons();
        document.querySelectorAll('.btn-press').forEach(ripple);
        return;
      }

      const primary = domains.find(d => d.is_primary);
      if (primary) {
        banner.classList.remove('hidden');
        document.getElementById('primary-domain-name').textContent = primary.domain;
      } else {
        banner.classList.add('hidden');
      }

      container.innerHTML = domains.map(d => `
        <div class="glass border ${d.is_primary ? 'border-emerald-500/30' : 'border-blue-500/20'} rounded-2xl p-5 slide-up">
          <!-- Domain header -->
          <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3 mb-3">
            <div class="flex items-start gap-3">
              <div class="w-10 h-10 ${d.is_primary ? 'bg-emerald-500/10' : 'bg-blue-500/10'} rounded-xl flex items-center justify-center shrink-0">
                <i data-lucide="${d.is_primary ? 'star' : 'globe'}" class="w-5 h-5 ${d.is_primary ? 'text-emerald-400' : 'text-blue-400'}"></i>
              </div>
              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  <h3 class="text-base font-bold text-white">${escapeHtml(d.domain)}</h3>
                  ${d.is_primary ? '<span class="text-[9px] font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full uppercase">Primary</span>' : ''}
                </div>
                <div class="flex items-center gap-2 mt-1 flex-wrap">
                  ${statusBadge(d.status)}
                  ${sslBadge(d.ssl_status)}
                  ${d.registrar ? `<span class="text-[10px] text-gray-500">· ${escapeHtml(d.registrar)}</span>` : ''}
                </div>
              </div>
            </div>
            <div class="flex flex-wrap gap-2 shrink-0">
              <button onclick="verifyDomain('${d.id}')" class="btn-press flex items-center gap-1.5 px-3 py-2 bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 font-bold rounded-lg text-xs transition border border-blue-500/20">
                <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Verify Domain
              </button>
              ${!d.is_primary && (d.status === 'connected' || d.status === 'live') ? `
                <button onclick="setPrimary('${d.id}')" class="btn-press flex items-center gap-1.5 px-3 py-2 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 font-bold rounded-lg text-xs transition border border-emerald-500/20">
                  <i data-lucide="star" class="w-3.5 h-3.5"></i> Set Primary
                </button>
              ` : ''}
              ${d.ssl_status === 'active' ? `
                <button onclick="renewSsl('${d.id}')" class="btn-press flex items-center gap-1.5 px-3 py-2 bg-violet-500/10 hover:bg-violet-500/20 text-violet-400 font-bold rounded-lg text-xs transition border border-violet-500/20">
                  <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Renew SSL
                </button>
              ` : ''}
              ${!d.is_primary ? `
                <button onclick="removeDomain('${d.id}')" class="btn-press flex items-center gap-1.5 px-3 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold rounded-lg text-xs transition border border-red-500/20">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Remove
                </button>
              ` : ''}
            </div>
          </div>

          <!-- Progress indicator -->
          ${progressIndicator(d.status)}

          <!-- DNS Records -->
          <div class="mt-4 pt-4 border-t border-blue-500/10">
            <div class="flex items-center justify-between mb-2">
              <h4 class="text-xs font-bold text-white uppercase tracking-wide flex items-center gap-1.5">
                <i data-lucide="list" class="w-3.5 h-3.5 text-blue-400"></i> DNS Records
              </h4>
              <button onclick="showDnsRecords('${d.id}')" class="text-xs font-bold text-blue-400 hover:text-blue-300 transition">Show Records</button>
            </div>
            <div id="dns-records-${d.id}" class="hidden space-y-2">
              ${(d.dns_records || []).map(r => `
                <div class="glass-soft border border-blue-500/10 rounded-lg p-3 grid grid-cols-12 gap-2 items-center text-xs">
                  <span class="col-span-2 sm:col-span-1 font-bold text-blue-400">${escapeHtml(r.type)}</span>
                  <span class="col-span-3 sm:col-span-2 text-gray-400">${escapeHtml(r.host)}</span>
                  <span class="col-span-5 sm:col-span-6 text-gray-300 font-mono break-all">${escapeHtml(r.value)}</span>
                  <span class="col-span-2 text-gray-500 text-right">${r.ttl}s</span>
                </div>
              `).join('')}
              <p class="text-xs text-gray-500 mt-2">${escapeHtml((d.dns_records || [])[0]?.description || 'Add these records at your domain registrar.')}</p>
            </div>
          </div>

          <!-- Redirect toggle -->
          ${!d.is_primary ? `
            <div class="mt-4 pt-4 border-t border-blue-500/10 flex items-center justify-between">
              <div>
                <p class="text-xs font-bold text-white">Redirect to Primary Domain</p>
                <p class="text-[10px] text-gray-500">Permanent (301) redirect this domain to the primary domain</p>
              </div>
              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" ${d.redirect_to_primary ? 'checked' : ''} onchange="toggleRedirect('${d.id}', this.checked)" class="sr-only peer">
                <div class="w-11 h-6 bg-gray-700 rounded-full peer peer-checked:bg-blue-600 transition-all relative after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-5"></div>
              </label>
            </div>
          ` : ''}

          <!-- SSL info -->
          ${d.ssl_status === 'active' ? `
            <div class="mt-4 pt-4 border-t border-blue-500/10 flex flex-wrap items-center gap-4 text-xs text-gray-500">
              <span class="flex items-center gap-1.5"><i data-lucide="shield" class="w-3.5 h-3.5 text-emerald-400"></i> SSL Issued: ${fmtDate(d.ssl_issued_at)}</span>
              <span class="flex items-center gap-1.5"><i data-lucide="calendar" class="w-3.5 h-3.5 text-amber-400"></i> SSL Expires: ${fmtDate(d.ssl_expires_at)}</span>
              <span class="flex items-center gap-1.5"><i data-lucide="check-circle" class="w-3.5 h-3.5 text-emerald-400"></i> Auto-renewal enabled</span>
            </div>
          ` : ''}

          <!-- Last verified -->
          ${d.last_verified_at ? `
            <div class="mt-3 text-[10px] text-gray-600">Last verified: ${new Date(d.last_verified_at).toLocaleString()}</div>
          ` : ''}
        </div>
      `).join('');

      if (window.lucide) lucide.createIcons();
      document.querySelectorAll('.btn-press').forEach(ripple);
    }

    // ── Add domain modal ─────────────────────────────────────
    window.showAddDomainModal = () => {
      const modal = document.getElementById('modal-container');
      modal.innerHTML = `
        <div class="modal-overlay fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50" onclick="closeModal(event)">
          <div class="modal-content glass border border-blue-500/20 rounded-2xl p-6 max-w-md w-full">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-lg font-bold text-white flex items-center gap-2"><i data-lucide="plus-circle" class="w-5 h-5 text-blue-400"></i> Add Custom Domain</h3>
              <button onclick="closeModal()" class="text-gray-500 hover:text-white transition text-[10px] font-bold uppercase tracking-wide">🔙 Back</button>
            </div>
            <form id="add-domain-form" class="space-y-4">
              <div>
                <label class="block text-xs font-bold uppercase text-gray-400 mb-1.5">Domain Name</label>
                <input type="text" id="new-domain-name" placeholder="shop.example.com" required
                  class="input-field w-full bg-[#0a1124]/80 border border-blue-500/20 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
                <p class="text-[10px] text-gray-500 mt-1">Enter the full domain name without https://</p>
              </div>
              <div>
                <label class="block text-xs font-bold uppercase text-gray-400 mb-1.5">Domain Registrar (optional)</label>
                <select id="new-domain-registrar" class="input-field w-full bg-[#0a1124]/80 border border-blue-500/20 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
                  <option value="">Select registrar...</option>
                  <option value="Namecheap">Namecheap</option>
                  <option value="Cloudflare">Cloudflare</option>
                  <option value="GoDaddy">GoDaddy</option>
                  <option value="Google Domains">Google Domains (Squarespace)</option>
                  <option value="Porkbun">Porkbun</option>
                  <option value="Hostinger">Hostinger</option>
                  <option value="Squarespace">Squarespace</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <button type="submit" class="btn-press w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold py-3 rounded-xl text-sm uppercase tracking-wide transition shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2">
                <i data-lucide="plus" class="w-4 h-4"></i> Add Domain
              </button>
            </form>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
      document.querySelectorAll('.btn-press').forEach(ripple);
      document.getElementById('add-domain-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const domain = document.getElementById('new-domain-name').value.trim();
        const registrar = document.getElementById('new-domain-registrar').value;
        if (!domain) return;
        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Adding...';
        if (window.lucide) lucide.createIcons();
        try {
          const result = await callEdge('add', { domain, registrar });
          showToast(result.message);
          closeModal();
          await loadDomains();
          // Show the DNS records for the new domain
          showDnsRecords(result.domain.id);
        } catch (err) {
          showToast('Error: ' + err.message);
          btn.disabled = false;
          btn.innerHTML = '<i data-lucide="plus" class="w-4 h-4"></i> Add Domain';
          if (window.lucide) lucide.createIcons();
        }
      });
    };

    // ── Verify domain ────────────────────────────────────────
    window.verifyDomain = async (domainId) => {
      showToast('Checking DNS records...');
      try {
        const result = await callEdge('verify', { domainId });
        showToast(result.message);
        await loadDomains();
      } catch (err) {
        showToast('Error: ' + err.message);
      }
    };

    // ── Remove domain ─────────────────────────────────────────
    window.removeDomain = async (domainId) => {
      const domain = domains.find(d => d.id === domainId);
      if (!domain) return;
      if (!confirm(`Are you sure you want to remove "${domain.domain}"? This action cannot be undone.`)) return;
      try {
        const result = await callEdge('remove', { domainId });
        showToast(result.message);
        await loadDomains();
      } catch (err) {
        showToast('Error: ' + err.message);
      }
    };

    // ── Set primary ───────────────────────────────────────────
    window.setPrimary = async (domainId) => {
      try {
        const result = await callEdge('set_primary', { domainId });
        showToast(result.message);
        await loadDomains();
      } catch (err) {
        showToast('Error: ' + err.message);
      }
    };

    // ── Renew SSL ──────────────────────────────────────────────
    window.renewSsl = async (domainId) => {
      showToast('Renewing SSL certificate...');
      try {
        const result = await callEdge('renew_ssl', { domainId });
        showToast(result.message);
        await loadDomains();
      } catch (err) {
        showToast('Error: ' + err.message);
      }
    };

    // ── Toggle redirect ───────────────────────────────────────
    window.toggleRedirect = async (domainId, enabled) => {
      try {
        const result = await callEdge('set_redirect', { domainId, redirect_to_primary: enabled, redirect_type: 301 });
        showToast(result.message);
      } catch (err) {
        showToast('Error: ' + err.message);
        await loadDomains();
      }
    };

    // ── Show DNS records ──────────────────────────────────────
    window.showDnsRecords = (domainId) => {
      const el = document.getElementById(`dns-records-${domainId}`);
      if (el) el.classList.toggle('hidden');
    };

    // ── DNS instructions ──────────────────────────────────────
    let dnsInstructionsLoaded = false;
    window.toggleDnsInstructions = async () => {
      const el = document.getElementById('dns-instructions');
      const toggleText = document.getElementById('dns-toggle-text');
      if (el.classList.contains('hidden')) {
        el.classList.remove('hidden');
        toggleText.textContent = 'Hide Instructions';
        if (!dnsInstructionsLoaded) {
          try {
            const data = await callEdge('all_registrars');
            el.innerHTML = data.registrars.map(r => `
              <div class="glass-soft border border-blue-500/10 rounded-xl p-4">
                <h4 class="text-sm font-bold text-white mb-2 flex items-center gap-2">
                  <i data-lucide="server" class="w-4 h-4 text-blue-400"></i> ${escapeHtml(r.name)}
                </h4>
                <ol class="space-y-1.5">
                  ${r.steps.map((s, i) => `<li class="text-xs text-gray-400 flex gap-2"><span class="text-blue-400 font-bold shrink-0">${i + 1}.</span><span>${escapeHtml(s)}</span></li>`).join('')}
                </ol>
              </div>
            `).join('');
            dnsInstructionsLoaded = true;
            if (window.lucide) lucide.createIcons();
          } catch (err) {
            el.innerHTML = '<p class="text-xs text-red-400">Failed to load instructions.</p>';
          }
        }
      } else {
        el.classList.add('hidden');
        toggleText.textContent = 'Show Instructions';
      }
    };

    // ── Load domains ─────────────────────────────────────────
    async function loadDomains() {
      try {
        const data = await callEdge('list');
        domains = data.domains || [];
        renderDomains();
      } catch (err) {
        showToast('Error loading domains: ' + err.message);
      }
    }

    // ── Init ──────────────────────────────────────────────────
    async function init() {
      try {
        const user = await getCurrentUser();
        if (!user) {
          window.location.href = '/auth.html?redirect=/admin-domains.html';
          return;
        }
        const { data: session } = await supabase.auth.getSession();
        accessToken = session?.session?.access_token;
        if (!accessToken) {
          window.location.href = '/auth.html?redirect=/admin-domains.html';
          return;
        }
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('main-content').classList.remove('hidden');
        await loadDomains();
      } catch (err) {
        showToast('Initialization error: ' + err.message);
      }
    }

    init();
  </script>
  <script type="module" src="/src/brand.js"></script>
  <!-- APP PROMOTION BANNER + LIVE PRODUCT PROMOTIONS -->
  <div id="app-promo-banner"></div>
  <div id="live-promo-alerts" class="fixed bottom-4 right-4 z-50 w-[340px] max-w-[90vw] space-y-3 pointer-events-none" aria-live="polite"></div>
  <script type="module" src="/src/app-promo-banner.js"></script>
  <script type="module" src="/src/live-promo-alerts.js"></script>
  <script type="module" src="/src/scroll-progress.js"></script>
</body>
</html>
